spring:
  cloud:
    aws:
      # CI 환경에는 AWS 자격증명이 없으므로 더미 값으로 Spring Cloud AWS 자동설정을 통과시킴
      region:
        static: ap-northeast-2
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key
  datasource:
    url: jdbc:h2:mem:potential;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    # CI/테스트 환경 — 실제 LLM 호출 없음, dummy 값으로 Bean 생성만 통과
    chat:
      client:
        enabled: false
    openai:
      api-key: test-api-key
      chat:
        options:
          model: gpt-4.1-mini
          temperature: 0.7
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.7
    vectorstore:
      pgvector:
        initialize-schema: false  # 테스트 환경에서는 스키마 자동 생성 비활성화

# PGVector DataSource 더미값 — 테스트에서 PgVectorConfig는 @Profile("!test")로 제외되므로 실제 연결 안 함
pgvector:
  datasource:
    url: jdbc:postgresql://localhost:5432/test
    username: test
    password: test

jwt:
  secret:
    key: cG90ZW50aWFsLXRlc3Qtc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctMjU2LWJpdHM=
    accessExpire: 1800000
    refreshExpire: 60480000

portone:
  api-secret: dGVzdC1hcGktc2VjcmV0
  webhook-secret: dGVzdC13ZWJob29rLXNlY3JldA==
  store-id: test-store-id
  channel-key: test-channel-key
  api-base: https://api.portone.io
  sdk-timeout: 10s

aws:
  s3:
    bucket: test-bucket
    region: ap-northeast-2
    cloudfront-domain: test.cloudfront.net

member:
  default-profile-image-url: https://test.cloudfront.net/profile-image/default-profile.png
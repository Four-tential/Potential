<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OAuth2 로그인 성공</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 40px auto; padding: 24px; color: #1f2937; }
        h1 { color: #059669; margin-bottom: 8px; }
        .subtitle { color: #6b7280; margin-bottom: 32px; }
        .row { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
        .label { font-size: 12px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .value { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; word-break: break-all; }
        .copy-btn { margin-left: 8px; padding: 4px 10px; font-size: 12px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .copy-btn:hover { background: #1d4ed8; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .badge-true { background: #dcfce7; color: #166534; }
        .badge-false { background: #fee2e2; color: #991b1b; }
        .hint { margin-top: 24px; padding: 16px; background: #eff6ff; border-radius: 8px; font-size: 13px; color: #1e40af; }
        code { background: #f3f4f6; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
        .next-btn { display: none; margin-top: 24px; padding: 12px 24px; background: #059669; color: white; text-decoration: none; border-radius: 6px; font-size: 15px; font-weight: 600; }
        .next-btn:hover { background: #047857; }
    </style>
</head>
<body>
    <h1>로그인 성공</h1>
    <p class="subtitle">소셜 로그인 흐름이 정상 동작했습니다. 아래 토큰으로 API 호출을 테스트할 수 있습니다.</p>

    <div class="row">
        <div class="label">Access Token</div>
        <div class="value">
            <span id="accessToken">-</span>
            <button type="button" class="copy-btn" onclick="copy('accessToken')">복사</button>
        </div>
    </div>

    <div class="row">
        <div class="label">has Onboarding</div>
        <div class="value"><span id="hasOnboarding" class="badge">-</span></div>
    </div>

    <div class="row">
        <div class="label">requires Phone Setup</div>
        <div class="value"><span id="requiresPhoneSetup" class="badge">-</span></div>
    </div>

    <div class="hint">
        Refresh Token 은 <code>HttpOnly Cookie</code> 로 자동 저장되었습니다 (path=/v1/auth).<br>
        <strong>requiresPhoneSetup=true</strong> 라면 <code>PATCH /v1/members/me</code> 에 phone 을 보내 채워야 합니다.
    </div>

    <a id="nextBtn" class="next-btn" href="#">다음 - 전화번호 입력 →</a>

    <script>
        const params = new URLSearchParams(window.location.search);
        const ticket = params.get("ticket");
        const source = params.get("source");

        const onboardEl = document.getElementById("hasOnboarding");
        const phoneEl = document.getElementById("requiresPhoneSetup");

        function renderFromSession() {
            const accessToken = sessionStorage.getItem("accessToken");
            if (!accessToken) return false;
            const hasOnboarding = sessionStorage.getItem("hasOnboarding") === "true";
            const requiresPhoneSetup = sessionStorage.getItem("requiresPhoneSetup") === "true";
            document.getElementById("accessToken").textContent = accessToken;
            onboardEl.textContent = String(hasOnboarding);
            onboardEl.classList.add(hasOnboarding ? "badge-true" : "badge-false");
            phoneEl.textContent = String(requiresPhoneSetup);
            phoneEl.classList.add(requiresPhoneSetup ? "badge-true" : "badge-false");
            if (requiresPhoneSetup) {
                const nextBtn = document.getElementById("nextBtn");
                nextBtn.href = "/oauth-phone-setup.html";
                nextBtn.style.display = "inline-block";
            }
            return true;
        }

        async function exchange() {
            // 연동 흐름은 sessionStorage 에 이미 저장됨 — 티켓 교환 생략
            if (source === "link" && renderFromSession()) return;
            if (!ticket) {
                document.getElementById("accessToken").textContent = "(ticket 없음)";
                onboardEl.textContent = "-";
                phoneEl.textContent = "-";
                return;
            }
            try {
                const res = await fetch("/v1/auth/oauth/ticket/exchange", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ticket })
                });
                const body = await res.json().catch(() => ({}));
                if (!res.ok || body.success === false) {
                    document.getElementById("accessToken").textContent = "(교환 실패: " + (body.message || res.status) + ")";
                    return;
                }
                const data = body.data || {};
                const accessToken = data.accessToken || "(없음)";
                const hasOnboarding = data.hasOnboarding;
                const requiresPhoneSetup = data.requiresPhoneSetup;

                // sessionStorage 보관 — URL 노출 회피
                sessionStorage.setItem("accessToken", accessToken);

                document.getElementById("accessToken").textContent = accessToken;
                onboardEl.textContent = String(hasOnboarding);
                onboardEl.classList.add(hasOnboarding ? "badge-true" : "badge-false");
                phoneEl.textContent = String(requiresPhoneSetup);
                phoneEl.classList.add(requiresPhoneSetup ? "badge-true" : "badge-false");

                if (requiresPhoneSetup) {
                    const nextBtn = document.getElementById("nextBtn");
                    nextBtn.href = "/oauth-phone-setup.html";
                    nextBtn.style.display = "inline-block";
                }
            } catch (err) {
                document.getElementById("accessToken").textContent = "(네트워크 오류: " + err.message + ")";
            }
        }

        function copy(id) {
            const text = document.getElementById(id).textContent;
            navigator.clipboard.writeText(text).then(() => alert("복사되었습니다"));
        }

        exchange();
    </script>
</body>
</html>

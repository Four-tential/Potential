<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>OAuth2 로그인 실패</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 40px auto; padding: 24px; color: #1f2937; }
        h1 { color: #dc2626; margin-bottom: 8px; }
        .subtitle { color: #6b7280; margin-bottom: 32px; }
        .row { background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
        .label { font-size: 12px; font-weight: 600; color: #991b1b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .value { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; word-break: break-all; color: #1f2937; }
        .hint { margin-top: 24px; padding: 16px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 13px; color: #4b5563; }
        code { background: #f3f4f6; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
        .retry { display: inline-block; margin-top: 16px; padding: 8px 16px; background: #2563eb; color: white; text-decoration: none; border-radius: 6px; font-size: 14px; }
        .retry:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <h1>로그인 실패</h1>
    <p class="subtitle">소셜 로그인 흐름 중 오류가 발생했습니다.</p>

    <div class="row">
        <div class="label">Error Code</div>
        <div class="value" id="errorCode">-</div>
    </div>

    <div class="row">
        <div class="label">Message</div>
        <div class="value" id="errorMessage">-</div>
    </div>

    <div class="hint">
        <strong>주요 에러 코드</strong><br>
        <code>ERR_SOCIAL_EMAIL_CONFLICT</code> — 동일 이메일로 이미 가입된 로컬 계정 존재 (마이페이지 수동 연동 필요)<br>
        <code>ERR_SOCIAL_PROVIDER_NOT_SUPPORTED</code> — 지원하지 않는 provider<br>
        <code>invalid_request</code> / <code>invalid_client</code> — Spring Security 단계 실패 (yml 설정/콘솔 확인)
    </div>

    <a href="/oauth2/authorization/kakao" class="retry">카카오 로그인 다시 시도</a>
    &nbsp;
    <a href="/oauth2/authorization/google" class="retry">구글 로그인 다시 시도</a>

    <script>
        const params = new URLSearchParams(window.location.search);
        document.getElementById("errorCode").textContent = params.get("error") || "(없음)";
        document.getElementById("errorMessage").textContent = params.get("message") || "(없음)";
    </script>
</body>
</html>

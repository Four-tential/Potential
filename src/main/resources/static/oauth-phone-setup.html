<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전화번호 입력</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 560px; margin: 40px auto; padding: 24px; color: #1f2937; }
        h1 { color: #059669; margin-bottom: 8px; }
        .subtitle { color: #6b7280; margin-bottom: 32px; }
        .field { margin-bottom: 16px; }
        .label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .input { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
        .input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .help { font-size: 12px; color: #6b7280; margin-top: 4px; }
        .submit-btn { width: 100%; padding: 12px; background: #059669; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .submit-btn:hover:not(:disabled) { background: #047857; }
        .submit-btn:disabled { background: #9ca3af; cursor: not-allowed; }
        .alert { margin-top: 16px; padding: 12px 16px; border-radius: 6px; font-size: 14px; display: none; }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .token-row { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; padding: 12px; margin-bottom: 24px; font-size: 12px; color: #6b7280; word-break: break-all; }
    </style>
</head>
<body>
    <h1>전화번호 입력</h1>
    <p class="subtitle">소셜 로그인 후 전화번호 설정이 필요합니다.</p>

    <div class="token-row">
        <strong>Access Token:</strong> <span id="tokenPreview">-</span>
    </div>

    <form id="phoneForm">
        <div class="field">
            <label class="label" for="phone">휴대전화 번호</label>
            <input
                type="tel"
                id="phone"
                class="input"
                placeholder="010-1234-5678"
                pattern="^01[016789]-\d{3,4}-\d{4}$"
                required
            >
            <div class="help">형식: 010-1234-5678 (- 포함)</div>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">저장</button>
    </form>

    <div id="alertSuccess" class="alert alert-success">
        저장되었습니다. 소셜 로그인 성공
    </div>
    <div id="alertError" class="alert alert-error">
        <span id="errorMessage">오류가 발생했습니다.</span>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const accessToken = params.get("accessToken");

        const tokenPreview = document.getElementById("tokenPreview");
        if (!accessToken) {
            tokenPreview.textContent = "(없음 — /oauth-success.html 에서 진입해야 합니다)";
            document.getElementById("submitBtn").disabled = true;
        } else {
            tokenPreview.textContent = accessToken.substring(0, 32) + "...";
        }

        const form = document.getElementById("phoneForm");
        const phoneInput = document.getElementById("phone");
        const submitBtn = document.getElementById("submitBtn");
        const alertSuccess = document.getElementById("alertSuccess");
        const alertError = document.getElementById("alertError");
        const errorMessage = document.getElementById("errorMessage");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            alertSuccess.style.display = "none";
            alertError.style.display = "none";

            const phone = phoneInput.value.trim();
            const regex = /^01[016789]-\d{3,4}-\d{4}$/;
            if (!regex.test(phone)) {
                errorMessage.textContent = "올바른 휴대전화 번호 형식으로 입력해주세요 (예: 010-1234-5678)";
                alertError.style.display = "block";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "저장 중...";

            try {
                const res = await fetch("/v1/members/me", {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + accessToken
                    },
                    body: JSON.stringify({ phone: phone })
                });

                const data = await res.json().catch(() => ({}));

                if (res.ok && data.success !== false) {
                    alertSuccess.style.display = "block";
                    submitBtn.textContent = "저장 완료";
                } else {
                    const msg = data.message || ("HTTP " + res.status);
                    errorMessage.textContent = msg;
                    alertError.style.display = "block";
                    submitBtn.disabled = false;
                    submitBtn.textContent = "저장";
                }
            } catch (err) {
                errorMessage.textContent = "네트워크 오류: " + err.message;
                alertError.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.textContent = "저장";
            }
        });
    </script>
</body>
</html>

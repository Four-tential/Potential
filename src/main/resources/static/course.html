<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코스 상세 · Potential</title>
    <link rel="stylesheet" href="/app-common.css">
    <style>
        .detail-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            gap: 24px;
            align-items: start;
        }
        @media (max-width: 880px) {
            .detail-layout { grid-template-columns: 1fr; }
        }
        .gallery {
            display: grid;
            gap: 6px;
            grid-template-columns: 1fr 1fr;
            margin-bottom: 18px;
        }
        .gallery .main {
            grid-column: 1 / -1;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #e2e8f0, #cbd5e1);
            background-size: cover;
            background-position: center;
            border-radius: 10px;
        }
        .gallery img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
        }
        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .detail-title { font-size: 24px; font-weight: 800; margin: 0 0 8px; line-height: 1.3; }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 18px 0 26px;
            padding: 16px;
            background: var(--panel-soft);
            border: 1px solid var(--line);
            border-radius: 10px;
        }
        .stat .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
        .stat .value { font-size: 15px; font-weight: 700; }
        .description {
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 14px;
            color: #374151;
            padding: 18px 0;
            border-top: 1px solid var(--line);
        }
        .address {
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 14px;
            margin-top: 12px;
        }
        .booking {
            position: sticky;
            top: 76px;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 22px;
            background: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .booking .price { font-size: 26px; font-weight: 800; }
        .booking .price small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 4px; }
        .booking .seats { font-size: 13px; color: var(--muted); margin-top: 4px; }
        .booking-line { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; color: var(--muted); }
        .booking-line strong { color: var(--ink); font-weight: 600; }
        .qty {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--line-strong);
            border-radius: 6px;
            padding: 6px;
            margin: 12px 0;
        }
        .qty button {
            width: 28px; height: 28px; border-radius: 4px;
            border: none; background: var(--panel);
            font-size: 16px; font-weight: 700;
        }
        .qty input {
            width: 60px; text-align: center;
            border: none; font-size: 15px; font-weight: 700;
        }

        /* 리뷰 */
        .review-summary {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 18px;
            background: var(--panel-soft);
            border: 1px solid var(--line);
            border-radius: 10px;
            margin-bottom: 16px;
        }
        .review-summary .big { font-size: 36px; font-weight: 800; line-height: 1; }
        .stars { color: #f59e0b; letter-spacing: 1px; }
        .review-item {
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
        }
        .review-item:last-child { border-bottom: none; }
        .review-head {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .review-content { font-size: 14px; line-height: 1.6; }
        .review-imgs { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .review-imgs img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; }
    </style>
</head>
<body>
    <div id="nav"></div>
    <main>
        <div id="content"></div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="/app-common.js"></script>
    <script>
        const P = window.Potential;
        const courseId = P.qs("id");
        const content = document.getElementById("content");
        const toast = document.getElementById("toast");

        function showToast(message, kind) {
            toast.className = "toast " + (kind || "");
            toast.textContent = message;
            requestAnimationFrame(() => toast.classList.add("show"));
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => toast.classList.remove("show"), 1800);
        }

        function stars(rating) {
            const r = Math.round((rating || 0));
            return "★".repeat(r) + "☆".repeat(Math.max(0, 5 - r));
        }

        let courseCache = null;

        async function loadCourse() {
            if (!courseId) {
                content.innerHTML = `<div class="empty">잘못된 접근입니다. courseId 가 필요해요.</div>`;
                return;
            }
            content.innerHTML = `<div class="muted">불러오는 중...</div>`;
            try {
                const course = await P.api(`/v1/courses/${courseId}`);
                courseCache = course;
                renderCourse(course);
                loadReviews(0);
            } catch (err) {
                content.innerHTML = `<div class="empty">코스를 불러오지 못했어요: ${P.escapeHtml(err.message)}</div>`;
            }
        }

        function renderCourse(c) {
            const images = c.images || [];
            const mainImg = images[0]
                ? `<div class="main" style="background-image: url('${P.escapeHtml(images[0])}');"></div>`
                : `<div class="main"></div>`;
            const subImgs = images.slice(1, 5).map(src => `<img src="${P.escapeHtml(src)}" alt="">`).join("");
            const statusKind = c.status === "OPEN" ? "ok"
                : c.status === "CLOSED" ? "warn"
                : c.status === "CANCELLED" ? "danger" : "";
            const remaining = Math.max(0, (c.capacity || 0) - (c.confirmCount || 0));
            const wishOn = c.isWishlisted ? "♥ 찜 해제" : "♡ 찜하기";
            const orderDisabled = c.status !== "OPEN" || remaining === 0;

            content.innerHTML = `
                <a href="/app.html" class="muted" style="font-size: 13px;">← 목록으로</a>
                <div class="spacer"></div>
                <div class="detail-layout">
                    <div>
                        <div class="gallery">
                            ${mainImg}
                            ${subImgs}
                        </div>
                        <div class="detail-meta">
                            <span class="badge accent">${P.escapeHtml(c.categoryName || c.categoryCode || "-")}</span>
                            <span class="badge ${statusKind}">${P.statusLabel(c.status)}</span>
                            <span class="badge">${P.levelLabel(c.level)}</span>
                        </div>
                        <h1 class="detail-title">${P.escapeHtml(c.title)}</h1>
                        <div class="muted" style="font-size: 14px;">
                            강사 · <strong>${P.escapeHtml((c.instructor && c.instructor.name) || "-")}</strong>
                            &nbsp;·&nbsp;
                            평점 <span class="stars">${stars(c.averageRating)}</span> ${(c.averageRating || 0).toFixed(1)} (${c.reviewCount || 0})
                        </div>

                        <div class="stat-grid">
                            <div class="stat"><div class="label">수강료</div><div class="value">${P.formatPrice(c.price)}</div></div>
                            <div class="stat"><div class="label">정원</div><div class="value">${c.capacity}명</div></div>
                            <div class="stat"><div class="label">확정 인원</div><div class="value">${c.confirmCount}명</div></div>
                            <div class="stat"><div class="label">남은 자리</div><div class="value">${remaining}명</div></div>
                        </div>

                        <div class="description">${P.escapeHtml(c.description || "상세 설명이 없습니다.")}</div>

                        <div class="address">
                            <div class="muted" style="font-size: 12px; margin-bottom: 4px;">진행 장소</div>
                            <div><strong>${P.escapeHtml(c.addressMain || "-")}</strong></div>
                            <div class="muted">${P.escapeHtml(c.addressDetail || "")}</div>
                        </div>

                        <div class="spacer-lg"></div>
                        <h2>리뷰</h2>
                        <div id="reviewSummary"></div>
                        <div id="reviewList"></div>
                        <div class="pagination" id="reviewPage"></div>
                    </div>

                    <aside>
                        <div class="booking">
                            <div class="price">${P.formatPrice(c.price)}<small>/ 1인</small></div>
                            <div class="seats">남은 자리 ${remaining}명 · 정원 ${c.capacity}명</div>

                            <div class="qty">
                                <button type="button" id="qtyMinus">−</button>
                                <input id="qtyInput" type="number" min="1" max="${Math.max(1, remaining)}" value="1">
                                <button type="button" id="qtyPlus">+</button>
                            </div>

                            <div class="booking-line"><span>주문 오픈</span><strong>${P.formatDateTime(c.orderOpenAt)}</strong></div>
                            <div class="booking-line"><span>주문 마감</span><strong>${P.formatDateTime(c.orderCloseAt)}</strong></div>
                            <div class="booking-line"><span>강의 시작</span><strong>${P.formatDateTime(c.startAt)}</strong></div>
                            <div class="booking-line"><span>강의 종료</span><strong>${P.formatDateTime(c.endAt)}</strong></div>

                            <div class="spacer-sm"></div>
                            <button type="button" class="btn primary block" id="orderBtn" ${orderDisabled ? "disabled" : ""}>
                                ${orderDisabled ? "주문 불가" : "신청하기"}
                            </button>
                            <div class="spacer-sm"></div>
                            <button type="button" class="btn block" id="wishBtn">${wishOn}</button>
                        </div>
                    </aside>
                </div>
            `;

            document.getElementById("qtyMinus").addEventListener("click", () => adjustQty(-1));
            document.getElementById("qtyPlus").addEventListener("click", () => adjustQty(1));
            document.getElementById("wishBtn").addEventListener("click", toggleWishlist);
            document.getElementById("orderBtn").addEventListener("click", placeOrder);
        }

        function adjustQty(delta) {
            const input = document.getElementById("qtyInput");
            const max = Number(input.max) || 1;
            let v = Number(input.value || 1) + delta;
            if (v < 1) v = 1;
            if (v > max) v = max;
            input.value = v;
        }

        async function toggleWishlist() {
            if (!P.isLoggedIn()) {
                window.location.href = "/login.html?next=" + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }
            const btn = document.getElementById("wishBtn");
            const isOn = courseCache.isWishlisted;
            try {
                if (isOn) {
                    await P.api(`/v1/courses/${courseId}/wishlist-courses`, { method: "DELETE" });
                    courseCache.isWishlisted = false;
                    btn.textContent = "♡ 찜하기";
                    showToast("위시리스트에서 제거됨");
                } else {
                    await P.api(`/v1/courses/${courseId}/wishlist-courses`, { method: "POST" });
                    courseCache.isWishlisted = true;
                    btn.textContent = "♥ 찜 해제";
                    showToast("위시리스트에 추가됨", "ok");
                }
            } catch (err) {
                showToast(err.message || "처리 실패", "danger");
            }
        }

        async function placeOrder() {
            if (!P.isLoggedIn()) {
                window.location.href = "/login.html?next=" + encodeURIComponent(window.location.pathname + window.location.search);
                return;
            }
            const qty = Number(document.getElementById("qtyInput").value || 1);
            const btn = document.getElementById("orderBtn");
            btn.disabled = true;
            btn.textContent = "처리 중...";
            try {
                const data = await P.api("/v1/orders", {
                    method: "POST",
                    body: { courseId, orderCount: qty }
                });
                if (data && data.orderId) {
                    showToast("주문 생성 완료", "ok");
                    setTimeout(() => { window.location.href = "/mypage.html?tab=orders"; }, 600);
                } else {
                    showToast("대기열에 진입했어요", "ok");
                    btn.disabled = false;
                    btn.textContent = "신청하기";
                }
            } catch (err) {
                showToast(err.message || "주문 실패", "danger");
                btn.disabled = false;
                btn.textContent = "신청하기";
            }
        }

        async function loadReviews(page) {
            const summaryEl = document.getElementById("reviewSummary");
            const listEl = document.getElementById("reviewList");
            const pageEl = document.getElementById("reviewPage");
            if (!summaryEl) return;

            try {
                const summary = await P.api(`/v1/courses/${courseId}/reviews/summary`).catch(() => null);
                if (summary) {
                    summaryEl.innerHTML = `
                        <div class="review-summary">
                            <div>
                                <div class="big">${(summary.averageRating || 0).toFixed(1)}</div>
                                <div class="stars">${stars(summary.averageRating)}</div>
                            </div>
                            <div class="muted" style="font-size: 13px;">총 ${summary.totalCount || 0}개의 리뷰</div>
                        </div>
                    `;
                }
            } catch (_) { /* ignore */ }

            try {
                const data = await P.api(`/v1/courses/${courseId}/reviews?page=${page}&size=5`);
                const items = (data && data.content) || [];
                if (items.length === 0) {
                    listEl.innerHTML = `<div class="empty">아직 리뷰가 없어요.</div>`;
                    pageEl.innerHTML = "";
                    return;
                }
                listEl.innerHTML = items.map(r => `
                    <article class="review-item">
                        <div class="review-head">
                            <span><span class="stars">${stars(r.rating)}</span> ${r.rating || 0}</span>
                            <span>${P.formatDateTime(r.createdAt)}</span>
                        </div>
                        <div class="review-content">${P.escapeHtml(r.content || "")}</div>
                        ${(r.imageUrls && r.imageUrls.length)
                            ? `<div class="review-imgs">${r.imageUrls.map(u => `<img src="${P.escapeHtml(u)}" alt="">`).join("")}</div>`
                            : ""}
                    </article>
                `).join("");

                if (data.totalPages > 1) {
                    const buttons = [];
                    buttons.push(`<button type="button" data-rp="${data.currentPage - 1}" ${data.currentPage === 0 ? "disabled" : ""}>‹</button>`);
                    for (let i = 0; i < data.totalPages; i++) {
                        buttons.push(`<button type="button" data-rp="${i}" class="${i === data.currentPage ? "active" : ""}">${i + 1}</button>`);
                    }
                    buttons.push(`<button type="button" data-rp="${data.currentPage + 1}" ${data.currentPage >= data.totalPages - 1 ? "disabled" : ""}>›</button>`);
                    pageEl.innerHTML = buttons.join("");
                    pageEl.querySelectorAll("button[data-rp]").forEach(btn => {
                        btn.addEventListener("click", () => {
                            if (btn.disabled) return;
                            loadReviews(Number(btn.getAttribute("data-rp")));
                        });
                    });
                } else {
                    pageEl.innerHTML = "";
                }
            } catch (err) {
                listEl.innerHTML = `<div class="empty">리뷰를 불러오지 못했어요.</div>`;
            }
        }

        document.getElementById("nav").innerHTML = P.renderNav("home");
        P.bindNav();
        loadCourse();
    </script>
</body>
</html>

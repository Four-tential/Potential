spring:
  config:
    import:
      - "aws-parameterstore:/config/potential-dev/"

  # DB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${db.host}:${db.port:3306}/${db.name}?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${db.username}
    password: ${db.password}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 50
      minimum-idle: 10
      connection-test-query: SELECT 1
      keepalive-time: 60000

  # Redis
  data:
    redis:
      host: ${redis.host}
      port: ${redis.port}

  # Flyway
  # url 명시 필수 — pgvector DataSource 공존 시 Flyway가 잘못된 DataSource를 바라보는 문제 방지
  flyway:
    enabled: true
    baseline-on-migrate: true
    url: jdbc:mysql://${db.host}:${db.port:3306}/${db.name}?useSSL=false&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    user: ${db.username}
    password: ${db.password}

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # Spring Batch
  batch:
    jdbc:
      initialize-schema: never   # Flyway 로 직접 관리
    job:
      enabled: false             # 서버 시작 시 자동 실행 방지

  # Spring AI
  ai: # ChatClient 자동 구성 비활성화 (AiConfig에서 수동 생성)
    chat:
      client:
        enabled: false

    openai:
      api-key: ${openai.api-key}   # AWS Parameter Store: /config/potential-dev/openai.api-key
      chat:
        options:
          model: gpt-4.1-mini      # 비용 절감 이슈로 mini버전 — agent는 코드에서 override 가능(4.1 버전 등으로 품질 상향)
          temperature: 0.7
          max-tokens: 2000
      embedding:
        options:
          model: text-embedding-3-small  # 1536차원

    ollama:
      chat:
        options:
          model: llama3.2          # dev에서는 @Profile("!ollama")이므로 실제로 사용 안 됨

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 1536

# PGVector DataSource — AWS Parameter Store에서 주입
# Parameter Store 키: /config/potential-dev/pgvector.*
pgvector:
  datasource:
    url: jdbc:postgresql://${pgvector.host}:${pgvector.port:5432}/${pgvector.db}
    username: ${pgvector.username}
    password: ${pgvector.password}

# AWS S3
aws:
  s3:
    bucket: potential-dev-images
    region: ap-northeast-2
    cloudfront-domain: d1273c5t8zsdng.cloudfront.net

# JWT
jwt:
  secret:
    key: ${jwt.key}
    accessExpire: 1800000
    refreshExpire: 604800000

# PortOne
portone:
  api-secret: ${portone.api-secret}
  webhook-secret: ${portone.webhook-secret}
  store-id: ${portone.store-id}
  channel-key: ${portone.channel-key}
  api-base: https://api.portone.io
  sdk-timeout: 10s

# Member
member:
  default-profile-image-url: ${member.default-profile-image-url}

# SpringDocs With Swagger
springdoc:
  api-docs.enabled: true
  swagger-ui:
    enabled: true
    display-request-duration: true
    tryItOutEnabled: true

# CORS
cors:
  allowed-origins: http://localhost:3000, https://frontend.url.com # 프론트엔드 CORS 연결
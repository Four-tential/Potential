spring:
  application:
    name: potential

  # DB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB}?serverTimezone=Asia/Seoul
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 30000 # 30초 커넥션 대기 타임아웃
      maximum-pool-size: 50
      minimum-idle: 10
      connection-test-query: SELECT 1 # 커넥션 확인용 쿼리 선언부
      keepalive-time: 60000 # 1분 마다 상태 체크

  # Spring Cloud AWS - 로컬에서는 EC2 메타데이터가 없으므로 리전을 명시
  # fallback 기본값 제공: S3 미사용 로컬 개발 시에도 앱 기동 가능
  cloud:
    aws:
      region:
        static: ${AWS_S3_REGION:ap-northeast-2}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:local-dummy-key}
        secret-key: ${AWS_SECRET_ACCESS_KEY:local-dummy-secret}

  # Redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  # Flyway
  # migration-perf 은 local 전용 — 성능 테스트용 대량 시딩과 payment 도메인 fixture 포함
  # dev/prod 는 locations 미지정 → Flyway 기본값(classpath:db/migration)만 사용하므로 자동 제외
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # url 명시 필수 — pgvector DataSource 공존 시 Flyway가 잘못된 DataSource를 바라보는 문제 방지
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB}?serverTimezone=Asia/Seoul
    user: ${DB_USER}
    password: ${DB_PASSWORD}

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # Spring Batch
  batch:
    jdbc:
      initialize-schema: never   # Flyway 가 관리
    job:
      enabled: false              # 서버 시작 시 Job 자동 실행 방지 — 반드시 false

  # Spring Security OAuth2 Client (Kakao + Google)
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # Spring AI
  ai:
    # ChatClient 자동 구성 비활성화 (AiConfig에서 @Profile로 수동 생성)
    chat:
      client:
        enabled: false

    # OpenAI — Chat은 ollama 프로파일로 대체, 임베딩은 OpenAI 단일화
    openai:
      api-key: ${OPENAI_API_KEY:local-not-used}
      chat:
        options:
          model: gpt-4.1-nano
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-3-small

    # Ollama — ollama 프로파일 활성화 시 Chat에서만 사용
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.7

    # PGVector 설정
    vectorstore:
      pgvector:
        initialize-schema: true   # pgvector 익스텐션 + vector_store 테이블 자동 생성
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 1536          # text-embedding-3-small 고정

# AWS S3 - fallback 기본값 제공: 실제 업로드는 실패하지만 앱 기동은 가능
aws:
  s3:
    bucket: ${AWS_S3_BUCKET:local-dev-bucket}
    region: ${AWS_S3_REGION:ap-northeast-2}
    cloudfront-domain: ${AWS_CLOUDFRONT_DOMAIN:localhost}

# JWT
jwt:
  secret:
    key: ${JWT_KEY}
    accessExpire: 1800000
    refreshExpire: 604800000

# OAuth2 (Kakao + Google)
# 기본값은 백엔드 자체 정적 페이지(간이 검증용). 운영/프론트 연동 시 환경변수로 override
oauth2:
  success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:8080/oauth-success.html}
  failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:8080/oauth-failure.html}
  link-confirm-redirect-uri: ${OAUTH2_LINK_CONFIRM_REDIRECT_URI:http://localhost:8080/oauth-link-confirm.html}
  cookie:
    secure: false   # 로컬 HTTP 환경 — 운영/dev에서는 default(true) 사용

# PortOne
portone:
  api-secret: ${PORTONE_API_SECRET}
  webhook-secret: ${PORTONE_WEBHOOK_SECRET}
  store-id: ${PORTONE_STORE_ID}
  channel-key: ${PORTONE_CHANNEL_KEY}
  api-base: ${PORTONE_API_BASE:https://api.portone.io}
  sdk-timeout: ${PORTONE_SDK_TIMEOUT:10s}

# LocalPaymentGatewayStub
payment:
  gateway:
    stub:
      enabled: false

# CircuitBreaker 설정
resilience4j:
  circuitbreaker:
    instances:
      portoneGetPayment:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

      portoneCancelPayment:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

# Member - fallback: 로컬 환경변수 미설정 시 플레이스홀더 URL 사용
member:
  default-profile-image-url: ${DEFAULT_PROFILE_IMAGE_URL:https://localhost/default-profile.png}

# 로컬 프로파일 전용 테스트 시드 계정 — 환경변수로 주입 (소스 하드코딩 금지)
app:
  test-account:
    password: ${TEST_ACCOUNT_PASSWORD}

# SpringDocs With Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: info
  file:
    name: logs/potential-app.log
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level traceId=%X{traceId:-} [%thread] %logger{36} : %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level traceId=%X{traceId:-} [%thread] %logger{36} : %msg%n'

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99 # P50, P95, P99 활성화
      sla:
        http.server.requests: 100ms, 200ms, 500ms, 1s, 3s # 특정 시간 내 처리 비율 확인
  prometheus:
    metrics:
      export:
        enabled: true

# CORS
cors:
  allowed-origins: http://localhost:3000, https://frontend.url.com # 프론트엔드 CORS 연결

# PGVector DataSource — PgVectorConfig에서 @Value로 읽음 (메인 MySQL과 별도)
pgvector:
  datasource:
    url: jdbc:postgresql://${PGVECTOR_HOST}:${PGVECTOR_PORT}/${PGVECTOR_DB}
    username: ${PGVECTOR_USER}
    password: ${PGVECTOR_PASSWORD}

---
#  Ollama Profile (로컬 LLM — 무료, API Key 불필요)
#  실행: --spring.profiles.active=local,ollama
#  Chat은 Ollama로 대체, 임베딩은 OpenAI 유지 (1536차원 고정)
spring:
  config:
    activate:
      on-profile: ollama
  ai:
    openai:
      chat:
        enabled: false   # Chat만 비활성화 — 임베딩은 OpenAI 유지
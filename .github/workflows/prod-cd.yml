name: Deploy (prod)

# main 브랜치에 push 될 때만 실행 (PR 머지 포함)
# PR 자체에서는 트리거 안 됨 — 머지 후 main에 들어가는 시점에만 배포
on:
  push:
    branches: [ "main" ]

# OIDC 토큰 발급 권한 (AWS 자격증명을 비밀키 없이 받기 위해 필요)
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
  ECR_REPO: ${{ secrets.PROD_ECR_REPO }}            # 예: potential/prod
  IMAGE_TAG: ${{ github.sha }}                       # 커밋 SHA로 추적
  PLATFORM: linux/amd64                              # prod 태스크 정의가 X86_64
  ECS_CLUSTER: potential-prod-ecs-cluster
  ECS_SERVICE: potential-prod-ecs-service
  TASKDEF_FAMILY: potential-prod-ecs-task-definition
  TASKDEF_TEMPLATE: infra/taskdef.json
  TASKDEF_RENDERED: infra/taskdef.rendered.json

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 운영 배포는 동일 브랜치 동시 푸시 시에도 끊지 않고 순차 실행
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      # 1. 소스코드 체크아웃
      - name: 소스코드 체크아웃
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # 2. jq 설치 (taskdef 응답 파싱용)
      - name: jq 설치
        run: sudo apt-get update && sudo apt-get install -y jq

      # 3. JDK 설정 (Gradle 의존성/래퍼 캐시 활성화로 빌드 시간 단축)
      - name: JDK 21 셋업
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 4. Gradle 빌드 (테스트는 CI에서 별도로 돌림)
      - name: Gradle 빌드
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon -x test
          cp build/libs/*.jar app.jar

      # 5. amd64 빌드를 위한 QEMU 설정
      - name: QEMU 셋업
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      # 6. Docker Buildx 설정
      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 7. 쉘 스크립트 실행 권한
      - name: 쉘 스크립트 실행 권한 부여
        run: chmod +x scripts/*.sh

      # 8. AWS 자격증명 (OIDC, prod 전용 role)
      - name: AWS 자격증명 설정 (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/Potential-Prod-github-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      # 9. ECR 로 이미지 빌드 & push (PLATFORM=linux/amd64)
      - name: ECR 빌드 및 push
        id: push
        run: ./scripts/ecr-push.sh

      # 10. taskdef 템플릿 렌더링 (placeholder → 실제 값)
      - name: Task Definition 템플릿 렌더링
        run: |
          IMG="${{ steps.push.outputs.FULL_URI }}"
          # 방어: ecr-push.sh가 FULL_URI를 비워뒀거나 step output 누락 시 조기 실패
          if [ -z "${IMG}" ]; then
            echo "[ERROR] FULL_URI output is empty. Check scripts/ecr-push.sh exports it to \$GITHUB_OUTPUT." >&2
            exit 1
          fi
          sed -e "s|<ACCOUNT_ID>|${ACCOUNT_ID}|g" \
              -e "s|<IMAGE_URI>|${IMG}|g" \
              "${TASKDEF_TEMPLATE}" > "${TASKDEF_RENDERED}"
          echo "[INFO] Rendered task definition:"
          cat "${TASKDEF_RENDERED}"

      # 11. 새 task definition 리비전 등록
      - name: Task Definition 등록
        id: register
        run: |
          REV_JSON=$(aws ecs register-task-definition \
            --cli-input-json file://"${TASKDEF_RENDERED}" \
            --region "${AWS_REGION}")
          REV_ARN=$(echo "$REV_JSON" | jq -r '.taskDefinition.taskDefinitionArn')
          echo "TASK_DEF_ARN=${REV_ARN}" >> "$GITHUB_OUTPUT"
          echo "[INFO] Registered: ${REV_ARN}"

      # 12. ECS 서비스 업데이트 (강제 재배포)
      - name: ECS 서비스 업데이트
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${{ steps.register.outputs.TASK_DEF_ARN }}" \
            --force-new-deployment \
            --region "${AWS_REGION}" \
            --query 'service.{Service:serviceName,TaskDef:taskDefinition,Desired:desiredCount}' \
            --output table

      # 13. 배포 안정화 대기 (헬스체크 통과까지)
      # 첫 배포는 이미지 pull + Spring Boot 콜드 스타트로 길어질 수 있어 25분 여유
      # ALB grace period(120s)와 task health check 통과까지 합쳐서 평균 5~8분 소요 예상
      # 타임아웃이 잦으면 grace period 조정 / 이미지 슬림화 / capacity provider 검토
      - name: 배포 안정화 대기
        run: |
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}"
        timeout-minutes: 25

      # 14. 최종 서비스 이벤트 출력 (성공/실패 흔적 확인용)
      - name: 서비스 이벤트 출력
        if: always()
        run: |
          aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --region "${AWS_REGION}" \
          | jq -r '.services[0].events[:10][] | "[\(.createdAt)] \(.message)"'
